name: Fare collector tests
on: [pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned dependencies in a virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run tests without external network
        run: |
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          sudo unshare --net -- bash -ceu 'ip link set lo up; cd "$1"; exec setpriv --reuid="$2" --regid="$3" --clear-groups --no-new-privs --inh-caps=-all --ambient-caps=-all --bounding-set=-all env -i PATH=/usr/bin:/bin LANG=C.UTF-8 "$1/.venv/bin/python" -m unittest discover -s tests -t .' bash "$PWD" "$runner_uid" "$runner_gid"
